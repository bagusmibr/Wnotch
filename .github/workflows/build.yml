name: Build Wnotch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Unit tests (lyrics + playback sync)
        run: |
          xcodebuild test \
            -project Wnotch.xcodeproj -scheme Wnotch -destination 'platform=macOS' \
            -derivedDataPath build/TestData CODE_SIGNING_ALLOWED=NO \
            -only-testing:WnotchTests/LyricsTitleCleanerTests \
            -only-testing:WnotchTests/PlaybackPositionResolverTests \
            -only-testing:WnotchTests/NowPlayingViewModelIntegrationTests \
            | tail -40
          exit ${PIPESTATUS[0]}

      - name: Build DMG
        run: ./build_dmg.sh

      - name: Verify universal binary
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/wn build/dmg/Wnotch.dmg
          lipo -info /tmp/wn/Wnotch.app/Contents/MacOS/Wnotch
          lipo /tmp/wn/Wnotch.app/Contents/MacOS/Wnotch -verify_arch arm64 x86_64
          hdiutil detach /tmp/wn

      - uses: actions/upload-artifact@v4
        with:
          name: Wnotch
          path: build/dmg/Wnotch.dmg
          if-no-files-found: error
